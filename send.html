<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1018">
<title>엄마에게 보내기</title>
<link rel="icon" href="icon-192.png">
<style>
  :root{--bg:#0b1018;--panel:#151b27;--line:#2a3344;--text:#e8edf5;--hint:#9aa4b2;--accent:#9fe3ff;--warm:#ffb3c7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif;
    padding:calc(18px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:560px;margin-inline:auto}
  h1{font-size:24px;margin:0 0 4px}
  p{margin:6px 0;color:var(--hint)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
  .card h2{font-size:18px;margin:0 0 10px}
  button,label.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:18px;text-align:center;border-radius:12px;padding:15px;border:0;cursor:pointer;
    background:var(--accent);color:#0b1018;margin:8px 0}
  button.ghost,label.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  button.rec{background:var(--warm)}
  button:disabled{opacity:.5}
  textarea{width:100%;min-height:110px;font:inherit;font-size:17px;border-radius:12px;border:1px solid var(--line);background:#0f1520;color:var(--text);padding:12px;resize:vertical}
  #thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
  #thumbs img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
  #voice-state{color:var(--warm);min-height:22px}
  #msg{min-height:26px;color:#ffd479;font-weight:700;text-align:center}
  #setup{display:none}
  .small{font-size:13px}
</style>
</head>
<body>
<h1>엄마에게 보내기 💌</h1>
<p id="hello">사진·목소리·글을 보내면 엄마 폰의 형스가 받아서 보여 주고 들려줘요. 보낸 것은 지워지지 않고 보관돼요.</p>

<div id="setup" class="card">
  <h2>링크가 올바르지 않아요</h2>
  <p>아빠(또는 엄마)가 형스 설정에서 '아들에게 줄 링크 복사'로 보내 준 링크를 그대로 열어 주세요.</p>
</div>

<div id="main">
  <div class="card">
    <h2>📷 사진</h2>
    <label class="btn" for="pick">사진 고르기 (여러 장 가능)</label>
    <input id="pick" type="file" accept="image/*" multiple hidden>
    <div id="thumbs"></div>
  </div>

  <div class="card">
    <h2>🎙️ 목소리</h2>
    <button id="rec" class="rec" type="button">녹음 시작 (최대 1분)</button>
    <div id="voice-state"></div>
    <audio id="play" controls hidden style="width:100%;margin-top:6px"></audio>
    <label class="btn ghost" for="pick-audio">녹음 파일 고르기</label>
    <input id="pick-audio" type="file" accept="audio/*" hidden>
  </div>

  <div class="card">
    <h2>✍️ 한마디</h2>
    <textarea id="note" placeholder="엄마 나 잘 지내요! (사진과 함께 보내면 사진 아래에 보여요)"></textarea>
  </div>

  <button id="send" type="button">엄마에게 보내기</button>
  <p id="msg"></p>
  <button id="clear" class="ghost" type="button">새로 쓰기</button>
  <p class="small">이 링크는 우리 가족 보관함 열쇠예요. 다른 사람에게 보내지 마세요. 홈 화면에 추가해 두면 앱처럼 쓸 수 있어요.</p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const P = new URLSearchParams(location.hash.slice(1));
  const C = { p: P.get("p") || "", k: P.get("k") || "", f: P.get("f") || "", t: P.get("t") || "", n: P.get("n") || "", m: P.get("m") || "엄마" };
  if (!C.p || !C.k || !C.f) { $("setup").style.display = "block"; $("main").style.display = "none"; return; }
  document.title = `${C.m}에게 보내기`;
  document.querySelector("h1").textContent = `${C.m}에게 보내기 💌`;
  $("hello").textContent = `사진·목소리·글을 보내면 ${C.m} 폰의 형스가 받아서 보여 주고 들려줘요. 보낸 것은 지워지지 않고 보관돼요.`;
  $("send").textContent = `${C.m}에게 보내기`;

  const base = `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(C.p)}/databases/(default)/documents/families/${encodeURIComponent(C.f)}/inbox?key=${encodeURIComponent(C.k)}`;
  const MAX = 900 * 1024;                                   // 문서 하나 1MB 제한
  let photos = [], voice = null;                            // photos: Blob[], voice: {blob, mime}
  const msg = (t) => { $("msg").textContent = t; };

  // 사진: 긴 쪽 1600px JPEG로 줄이고, 그래도 크면 더 줄임
  async function shrink(file) {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    for (const [side, q] of [[1600, 0.82], [1280, 0.78], [1024, 0.72], [800, 0.7]]) {
      const k = Math.min(1, side / Math.max(bmp.width, bmp.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
      cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
      const b = await new Promise((ok) => cv.toBlob(ok, "image/jpeg", q));
      if (b && b.size <= MAX) return b;
    }
    throw new Error("사진이 너무 커요");
  }
  $("pick").onchange = async () => {
    msg("사진 준비 중…");
    for (const f of [...$("pick").files].slice(0, 10)) {
      try { photos.push(await shrink(f)); } catch (e) { msg(`사진 한 장을 넣지 못했어요 (${e.message})`); }
    }
    $("pick").value = ""; drawThumbs(); msg(photos.length ? `사진 ${photos.length}장 준비됐어요.` : "");
  };
  function drawThumbs() { $("thumbs").innerHTML = ""; photos.forEach((b) => { const i = new Image(); i.src = URL.createObjectURL(b); $("thumbs").append(i); }); }

  // 목소리: 바로 녹음 (최대 60초) 또는 파일 고르기
  let rec = null, chunks = [], recTimer = null;
  $("rec").onclick = async () => {
    if (rec && rec.state === "recording") { rec.stop(); return; }
    try {
      const st = await navigator.mediaDevices.getUserMedia({ audio: true });
      const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
      rec = new MediaRecorder(st, mime ? { mimeType: mime, audioBitsPerSecond: 32000 } : {});
      chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => {
        clearTimeout(recTimer); st.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: (rec.mimeType || "audio/webm").split(";")[0] });
        setVoice(blob, blob.type); $("rec").textContent = "다시 녹음하기";
      };
      rec.start(); $("rec").textContent = "녹음 끝내기 ■"; $("voice-state").textContent = "● 녹음 중… 말이 끝나면 '녹음 끝내기'를 누르세요.";
      recTimer = setTimeout(() => rec.state === "recording" && rec.stop(), 60000);
    } catch (e) { $("voice-state").textContent = "마이크를 쓸 수 없어요. 크롬에서 마이크를 허용해 주세요."; }
  };
  $("pick-audio").onchange = () => { const f = $("pick-audio").files[0]; if (f) setVoice(f, f.type || "audio/mp4"); $("pick-audio").value = ""; };
  function setVoice(blob, mime) {
    if (blob.size > MAX) { voice = null; $("voice-state").textContent = "녹음이 너무 길어요. 1분 안쪽으로 다시 녹음해 주세요."; return; }
    voice = { blob, mime };
    $("play").src = URL.createObjectURL(blob); $("play").hidden = false;
    $("voice-state").textContent = `목소리 준비됐어요 (${Math.round(blob.size / 1024)}KB). 아래에서 들어 볼 수 있어요.`;
  }

  const b64 = (blob) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); });
  async function put(kind, note, blob, mime) {
    const fields = { kind: { stringValue: kind }, t: { integerValue: String(Date.now()) }, note: { stringValue: note || "" }, mime: { stringValue: mime || "" } };
    if (blob) fields.data = { bytesValue: await b64(blob) };
    const r = await fetch(base, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ fields }) });
    if (!r.ok) throw new Error(r.status === 403 ? "보관함 권한 오류" : `HTTP ${r.status}`);
    await new Promise((ok) => setTimeout(ok, 30));          // 보낸 순서(t)가 겹치지 않게
  }

  $("send").onclick = async () => {
    const note = $("note").value.trim();
    if (!photos.length && !voice && !note) { msg("보낼 사진·목소리·글을 먼저 넣어 주세요."); return; }
    $("send").disabled = true;
    try {
      let n = 0;
      for (let i = 0; i < photos.length; i++) { msg(`사진 보내는 중… ${i + 1}/${photos.length}`); await put("photo", i === 0 ? note : "", photos[i], "image/jpeg"); n++; }
      if (voice) { msg("목소리 보내는 중…"); await put("voice", photos.length ? "" : note, voice.blob, voice.mime); n++; }
      if (!photos.length && !voice) { await put("text", note); n++; }
      // 엄마 폰 ntfy 앱에 알림 (형스가 열려 있으면 바로 받아 옴)
      if (C.t) {
        const what = [photos.length && `사진 ${photos.length}장`, voice && "음성 메시지", !photos.length && !voice && "메시지"].filter(Boolean).join("과 ");
        fetch(`https://ntfy.sh/${encodeURIComponent(C.t)}?title=${encodeURIComponent(`${C.n || "아들"}의 소식`)}&tags=vault,envelope`,
          { method: "POST", body: `새 소식이 왔어요 (${what}). 형스를 열어 보세요!` }).catch(() => {});
      }
      msg(`보냈어요! (${n}개) ${C.m}가 형스를 열면 볼 수 있어요.`);
      photos = []; voice = null; drawThumbs(); $("play").hidden = true; $("voice-state").textContent = ""; $("note").value = "";
    } catch (e) { msg(`보내지 못했어요: ${e.message}. 인터넷을 확인하고 다시 눌러 주세요.`); }
    finally { $("send").disabled = false; }
  };
  $("clear").onclick = () => { photos = []; voice = null; drawThumbs(); $("play").hidden = true; $("voice-state").textContent = ""; $("note").value = ""; msg(""); };
})();
</script>
</body>
</html>
